services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: team-memory-api
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/team_memory.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
